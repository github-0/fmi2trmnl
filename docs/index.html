<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Turku weather</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 800px; height: 480px;
    background: #ffffff; color: #000000;
    font-family: 'DejaVu Sans', Arial, sans-serif;
    overflow: hidden;
  }
  .page { padding: 24px 32px; box-sizing: border-box; width: 100%; height: 100%; }
  .header {
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 3px solid #000; padding-bottom: 10px; margin-bottom: 18px;
  }
  .place { font-size: 34px; font-weight: 700; }
  .updated { font-size: 18px; }
  .now { display: flex; align-items: baseline; gap: 40px; margin-bottom: 26px; }
  .temp { font-size: 96px; font-weight: 700; line-height: 1; }
  .now-details { font-size: 24px; line-height: 1.5; }
  table { width: 100%; border-collapse: collapse; font-size: 20px; }
  th { text-align: left; border-bottom: 2px solid #000; padding: 6px 8px; }
  td { padding: 6px 8px; border-bottom: 1px solid #666; }
</style>
</head>
<body>
  <div class="page">
    <div class="header">
      <span class="place">Turku</span>
      <span class="updated">Updated 21:13</span>
    </div>

    <div class="now">
      <div class="temp">14°</div>
      <div class="now-details">
        Clear<br>
        Feels like 12°<br>
        Wind 2.0 m/s &nbsp;·&nbsp; Precip 0.0 mm
      </div>
    </div>

    <table>
      <thead>
        <tr><th>Time</th><th>Temp</th><th>Conditions</th><th>Wind</th><th>Precip</th></tr>
      </thead>
      <tbody>
        <tr>
          <td>23:00</td>
          <td>13°</td>
          <td>Clear</td>
          <td>2.0 m/s</td>
          <td>0.0 mm</td>
        </tr>

        <tr>
          <td>00:00</td>
          <td>12°</td>
          <td>Clear</td>
          <td>1.4 m/s</td>
          <td>0.0 mm</td>
        </tr>

        <tr>
          <td>01:00</td>
          <td>12°</td>
          <td>Clear</td>
          <td>1.2 m/s</td>
          <td>0.0 mm</td>
        </tr>

        <tr>
          <td>02:00</td>
          <td>12°</td>
          <td>Clear</td>
          <td>0.8 m/s</td>
          <td>0.0 mm</td>
        </tr>

        <tr>
          <td>03:00</td>
          <td>11°</td>
          <td>Clear</td>
          <td>0.5 m/s</td>
          <td>0.0 mm</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>Helsinki sää (Inkplate 6 V2 (800x600, 3-bit grayscale))</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 800px; height: 600px;
    background: #ffffff; color: #000000;
    font-family: 'DejaVu Sans', Arial, sans-serif;
    overflow: hidden;
  }
  .page { padding: 32px 34px; box-sizing: border-box; width: 100%; height: 100%; }
  .header {
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 3px solid #000;
    padding-bottom: 12px;
    margin-bottom: 24px;
  }
  .place { font-size: 40px; font-weight: 700; }
  .updated { font-size: 22px; }
  .now {
    display: flex; align-items: center;
    gap: 44px;
    margin-bottom: 36px;
  }
  .temp { font-size: 120px; font-weight: 700; line-height: 1; }
  .now-details { font-size: 28px; line-height: 1.55; }
  table { width: 100%; border-collapse: collapse; font-size: 24px; }
  th { text-align: left; border-bottom: 2px solid #000; padding: 9px 8px; }
  td { padding: 9px 8px; border-bottom: 1px solid #666; }
</style>
</head>
<body>
  <div class="page">
    <div class="header">
      <span class="place">Helsinki</span>
      <span class="updated">Päivitetty 04:55</span>
    </div>

    <div class="now">
      <div class="temp">13°</div>
      <div class="now-details">
        Pilvistä<br>
        Tuntuu kuin 11°<br>
        Tuuli 2 m/s &nbsp;·&nbsp; Sade 0 mm
      </div>
    </div>

    <table>
      <thead>
        <tr><th>Aika</th><th>Lämpötila</th><th>Sää</th><th>Tuuli</th><th>Sade</th></tr>
      </thead>
      <tbody>
        <tr>
          <td>09:00</td>
          <td>13°</td>
          <td>Pilvistä</td>
          <td>2 m/s</td>
          <td>0 mm</td>
        </tr>

        <tr>
          <td>15:00</td>
          <td>17°</td>
          <td>Puolipilvistä</td>
          <td>4 m/s</td>
          <td>0 mm</td>
        </tr>

        <tr>
          <td>21:00</td>
          <td>16°</td>
          <td>Pilvistä</td>
          <td>4 m/s</td>
          <td>0 mm</td>
        </tr>

        <tr>
          <td>03:00</td>
          <td>12°</td>
          <td>Puolipilvistä</td>
          <td>5 m/s</td>
          <td>0 mm</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
